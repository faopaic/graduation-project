<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT COMPANY - 会社経営シミュレーション</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/company.css">
  <link rel="stylesheet" href="css/employee.css">
  <link rel="stylesheet" href="css/project.css">
  <link rel="stylesheet" href="css/event.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <div class="brand-line"><span class="brand-mark">▣</span><p class="eyebrow">IT COMPANY</p></div>
        <h1 id="company-name">Blue Orbit Systems</h1>
      </div>
      <div class="topbar-controls">
        <button id="pause-button" class="control-button" type="button">Ⅱ 一時停止</button>
        <button id="speed-1" class="speed-button active" type="button">1×</button>
        <button id="speed-2" class="speed-button" type="button">2×</button>
        <button id="speed-4" class="speed-button" type="button">4×</button>
        <span id="current-date" class="date-badge">1年目 4月</span>
        <div id="time-progress"><div id="time-progress-fill"></div></div>
      </div>
    </header>

    <section class="status-grid" aria-label="会社ステータス">
      <div class="status-card"><span>💰 資金</span><strong id="funds">---</strong></div>
      <div class="status-card"><span>👥 社員</span><strong id="employee-count">---</strong></div>
      <div class="status-card"><span>⭐ 評判</span><strong id="reputation">---</strong></div>
      <div class="status-card"><span>💻 技術力</span><strong id="technology">---</strong></div>
    </section>

    <section class="game-content">
      <div id="notification-area" class="notification-area" aria-live="polite"></div>
      <div id="main-content"></div>
    </section>

    <footer class="bottom-nav">
      <nav aria-label="メインメニュー">
        <button class="nav-button active" data-view="dashboard">会社</button>
        <button class="nav-button" data-view="employees">社員</button>
        <button class="nav-button" data-view="projects">案件</button>
        <button class="nav-button" data-view="events">イベント</button>
      </nav>
      <button id="next-month-button" class="primary-button">次の月へ <span>→</span></button>
    </footer>
  </main>
  <div id="modal-root"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
